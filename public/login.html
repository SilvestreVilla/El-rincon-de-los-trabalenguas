<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · El Rincón de los Trabalenguas</title>
  <meta name="description" content="Inicia sesión para retomar tu práctica.">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <header class="encabezado">
    <nav aria-label="Principal">
      <a href="index.html" class="marca"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#3346D3"/><path d="M9 13h16M9 18h11M9 23h7" stroke="#FFE27A" stroke-width="2.6" stroke-linecap="round"/></svg><span>El Rincón de los Trabalenguas</span></a>
      <div class="nav-enlaces">
        <a href="index.html" class="nav-texto">Catálogo</a>
        <div id="nav-sesion" class="nav-enlaces">
          <a href="login.html" class="boton boton-secundario">Iniciar sesión</a>
          <a href="registro.html" class="boton">Crear cuenta</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="contenedor-form">
      <header>
        <h1>Inicia sesión</h1>
        <p class="bajada">Retoma tu práctica donde la dejaste.</p>
      </header>

      <form id="form-login" class="tarjeta-form" novalidate>
        <div id="aviso" class="aviso oculto" role="alert"></div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required>
        </div>

        <div class="campo">
          <div class="campo-fila">
            <label for="contrasena">Contraseña</label>
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
          </div>
          <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" id="enviar" class="boton boton-bloque">Iniciar sesión</button>
      </form>

      <p class="pie-form">¿No tienes cuenta? <a href="registro.html">Crea una</a></p>
    </div>
  </main>

  <footer class="pie">
    <div>
      <span>El Rincón de los Trabalenguas · v0.1</span>
      <a href="privacidad.html">Aviso de privacidad</a>
    </div>
  </footer>
</body>
</html>
